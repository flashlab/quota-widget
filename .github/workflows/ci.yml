name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Shared unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Assemble release APK (debug-signed)
        run: ./gradlew :androidApp:assembleRelease -PallowDebugReleaseSigning=true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: quota-widget-apks
          path: androidApp/build/outputs/apk/*/*.apk
